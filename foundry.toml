[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1000000
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
auto_detect_remappings = false
ffi = false
fs_permissions = []
gas_limit = "300000000"

[profile.default.fuzz]
runs = 256

# forge's low-severity lints (forge 1.8) explore every branch of TickMath.getSqrtPriceAtTick when it is
# inlined into PanicHook.beforeSwap and never finish. Linting is not part of the build contract; run
# `forge lint --severity high med info gas` by hand instead.
[lint]
lint_on_build = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
ignore = ["lib/**/*.sol"]
